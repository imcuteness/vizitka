<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>кьютнесс</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Шрифты: Unbounded для заголовков, Inter для текста -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: 'Inter', 'Segoe UI', Roboto, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      background: #0e0f1a;
    }

    /* ===== Фоновое изображение ===== */
    .bg {
      position: fixed;
      inset: -40px;
      background-image: url('https://i.ibb.co/m5MG7v1f/bg.jpg');
      background-size: cover;
      background-position: center;
      filter: blur(9px) brightness(0.85) saturate(1.1);
      transform: scale(1.1);
      z-index: -3;
      animation: bgFloat 30s ease-in-out infinite alternate;
    }

    @keyframes bgFloat {
      from { transform: scale(1.1) translate(0, 0); }
      to   { transform: scale(1.15) translate(-15px, -15px); }
    }

    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 30% 20%, rgba(80, 90, 200, 0.25), transparent 60%),
                  radial-gradient(circle at 80% 80%, rgba(255, 140, 0, 0.14), transparent 55%),
                  linear-gradient(180deg, rgba(10, 12, 25, 0.4), rgba(10, 12, 25, 0.6));
      z-index: -2;
      pointer-events: none;
    }

    /* ====== Обёртка контента ====== */
    .content {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      animation: contentIn 0.9s cubic-bezier(0.2, 0.9, 0.25, 1.05) both;
    }

    @keyframes contentIn {
      from { opacity: 0; transform: translateY(25px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== Профиль — просто парит в воздухе ===== */
    .profile {
      text-align: center;
      animation: profileIn 0.9s 0.1s cubic-bezier(0.2, 0.9, 0.25, 1.05) both;
    }

    @keyframes profileIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 1rem;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                  0 0 0 1px rgba(255, 255, 255, 0.15);
      background: #eef0f5;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .name {
      font-family: 'Unbounded', 'Inter', sans-serif;
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
      margin-bottom: 0.5rem;
      line-height: 1.2;
      text-shadow: 0 2px 20px rgba(0, 0, 0, 0.7);
    }

    .description {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      max-width: 340px;
      margin: 0 auto;
      line-height: 1.5;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.7);
    }

    /* ===== Кнопки ===== */
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .btn {
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding: 1rem 1.5rem;
      border-radius: 0.9rem; /* более квадратные */
      font-size: 1.08rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.22s ease, box-shadow 0.22s ease, filter 0.22s ease;
      border: none;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3);
      position: relative;
      opacity: 0;
      animation: btnIn 0.6s cubic-bezier(0.2, 0.9, 0.25, 1.05) forwards;
    }

    .btn:nth-child(1) { animation-delay: 0.25s; }
    .btn:nth-child(2) { animation-delay: 0.33s; }
    .btn:nth-child(3) { animation-delay: 0.41s; }
    .btn:nth-child(4) { animation-delay: 0.49s; }
    .btn:nth-child(5) { animation-delay: 0.57s; }

    @keyframes btnIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .btn i { font-size: 1.35rem; width: 1.7rem; text-align: center; }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 30px -8px rgba(0, 0, 0, 0.45);
      filter: brightness(1.08);
    }
    .btn:active {
      transform: translateY(0);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
    }

    /* Цвета кнопок */
    .btn-tiktok   { background: linear-gradient(135deg, #2b2b2b, #000000); }
    .btn-telegram { background: linear-gradient(135deg, #37bbfe, #1c93d1); }
    .btn-contact  { background: #ffffff; color: #1e1e2f;
                    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.7); }
    .btn-contact i { color: #5f6a89; }
    .btn-donate   { background: linear-gradient(135deg, #ffb347, #ff8c00); }
    .btn-discord  { background: linear-gradient(135deg, #7289da, #4e5d94); opacity: 0.88; cursor: not-allowed; }

    .btn-discord:hover {
      transform: translateY(-3px);
      box-shadow: 0 16px 30px -8px rgba(78, 93, 148, 0.65);
      filter: brightness(1.08);
      opacity: 0.95;
    }

    .btn-discord::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 0.9rem;
      background: repeating-linear-gradient(45deg,
        rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.07) 10px,
        transparent 10px, transparent 20px);
      pointer-events: none;
    }

    /* ====== Плеер ====== */
    .player {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 300px;
      max-width: calc(100vw - 44px);
      background: rgba(20, 22, 38, 0.78);
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
      border-radius: 1rem;
      padding: 0.85rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55),
                  0 0 0 1px rgba(255, 255, 255, 0.12) inset;
      z-index: 50;
      cursor: grab;
      user-select: none;
      transition: box-shadow 0.3s ease, transform 0.15s ease, background 0.3s ease;
      touch-action: none;
      opacity: 0;
      animation: playerIn 0.8s 0.9s cubic-bezier(0.2, 0.9, 0.25, 1.05) forwards;
    }

    @keyframes playerIn {
      from { opacity: 0; transform: translateY(30px) scale(0.9); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .player:hover {
      box-shadow: 0 28px 60px rgba(0, 0, 0, 0.7),
                  0 0 0 1px rgba(255, 255, 255, 0.2) inset;
      background: rgba(28, 30, 50, 0.85);
    }

    .player.dragging {
      cursor: grabbing;
      transform: scale(1.04);
      box-shadow: 0 35px 70px rgba(106, 76, 255, 0.5),
                  0 0 0 1px rgba(255, 255, 255, 0.3) inset;
    }

    .player-cover {
      width: 54px; height: 54px;
      border-radius: 0.7rem;
      overflow: hidden;
      flex-shrink: 0;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
      background: #2a2d42;
    }
    .player-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .player.playing .player-cover img {
      animation: coverSpin 12s linear infinite;
    }
    @keyframes coverSpin {
      from { transform: rotate(0deg) scale(1.1); }
      to   { transform: rotate(360deg) scale(1.1); }
    }

    .player-info {
      flex: 1;
      min-width: 0;
      text-align: left;
    }

    .player-title {
      font-family: 'Inter', sans-serif;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-artist {
      font-family: 'Inter', sans-serif;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .player-progress {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      margin-top: 7px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .player-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6a4cff, #ff8c00);
      border-radius: 4px;
      transition: width 0.15s linear;
    }

    .player-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #6a4cff, #4e5d94);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      box-shadow: 0 6px 16px rgba(106, 76, 255, 0.5);
    }
    .player-btn:hover {
      transform: scale(1.1);
      filter: brightness(1.15);
      box-shadow: 0 10px 24px rgba(106, 76, 255, 0.7);
    }
    .player-btn:active { transform: scale(0.95); }

    .player-hint {
      position: absolute;
      top: -22px;
      right: 4px;
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.5);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }
    .player:hover .player-hint { opacity: 1; }

    /* ====== Мобильная адаптация ====== */
    @media (max-width: 480px) {
      body { padding: 1rem; }

      .avatar { width: 92px; height: 92px; }
      .name { font-size: 1.6rem; }
      .description { font-size: 0.92rem; }

      .btn { padding: 0.9rem 1.2rem; font-size: 1rem; gap: 0.6rem; border-radius: 0.8rem; }
      .btn i { font-size: 1.2rem; width: 1.6rem; }

      .player {
        width: 260px;
        padding: 0.7rem 0.85rem;
        right: 12px; bottom: 12px;
      }
      .player-cover { width: 46px; height: 46px; }
      .player-btn { width: 38px; height: 38px; font-size: 0.9rem; }
    }

    @media (max-width: 360px) {
      .btn { font-size: 0.9rem; padding: 0.8rem 1rem; }
      .btn i { font-size: 1rem; width: 1.4rem; }
      .player { width: 230px; }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="bg-overlay"></div>

  <div class="content">
    <!-- Профиль — просто парит в воздухе -->
    <div class="profile">
      <div class="avatar">
        <img src="https://i.ibb.co/fJGLfXg/avatar.jpg" alt="Аватар">
      </div>
      <h1 class="name">cuteness.su</h1>
      <p class="description">Тиктокер, эдитор, говорят что крутой. Люблю визуальные новеллы и аниме.</p>
    </div>

    <!-- Кнопки -->
    <div class="links">
      <a href="https://www.tiktok.com/@MS4wLjABAAAArzWQXyJMWkfAfJ7kIkmhV4ci2h9R5O5_UVokN2UmzvS5sYb_iWNy8eYMk4jQ13si?_r=1&_t=ZT-99k1nHzKDXB" class="btn btn-tiktok" target="_blank" rel="noopener">
        <i class="fab fa-tiktok"></i> TikTok
      </a>
      <a href="https://t.me/keionchek" class="btn btn-telegram" target="_blank" rel="noopener">
        <i class="fab fa-telegram-plane"></i> Telegram канал
      </a>
      <a href="https://t.me/awcuteness" class="btn btn-contact" target="_blank" rel="noopener">
        <i class="fas fa-envelope"></i> Связь со мной
      </a>
      <a href="https://dalink.to/awcuteness" class="btn btn-donate" target="_blank" rel="noopener">
        <i class="fas fa-donate"></i> Задонатить
      </a>
      <div class="btn btn-discord" role="button" aria-disabled="true" tabindex="-1">
        <i class="fab fa-discord"></i> Скоро...
      </div>
    </div>
  </div>

  <!-- Плеер -->
  <div class="player" id="player">
    <div class="player-hint">перетащи меня ✥</div>
    <div class="player-cover">
      <img src="https://files.catbox.moe/horh0v.jpg" alt="Обложка">
    </div>
    <div class="player-info">
      <div class="player-title">Raindrops and Puddles</div>
      <div class="player-artist">4LS Sound Team</div>
      <div class="player-progress" id="progress">
        <div class="player-progress-fill" id="progressFill"></div>
      </div>
    </div>
    <button class="player-btn" id="playBtn" aria-label="Play/Pause">
      <i class="fas fa-pause" id="playIcon"></i>
    </button>

    <audio id="audio" loop preload="auto">
      <source src="https://files.catbox.moe/r6b9gt.m4a" type="audio/mp4">
    </audio>
  </div>

  <script>
    document.querySelectorAll('a[href="#"]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        console.log('Ссылка-заглушка. Замените href на реальный URL.');
      });
    });

    const discordBtn = document.querySelector('.btn-discord');
    if (discordBtn) {
      discordBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
      });
    }

    /* ============ ПЛЕЕР ============ */
    (function initPlayer() {
      const player   = document.getElementById('player');
      const audio    = document.getElementById('audio');
      const playBtn  = document.getElementById('playBtn');
      const playIcon = document.getElementById('playIcon');
      const progress = document.getElementById('progress');
      const fill     = document.getElementById('progressFill');

      // Громкость 50%
      audio.volume = 0.5;

      function tryAutoplay() {
        audio.muted = false;
        const p = audio.play();
        if (p && p.catch) {
          p.catch(() => {
            audio.muted = true;
            audio.play().catch(() => {});
            const unlock = () => {
              audio.muted = false;
              audio.volume = 0.5;
              audio.play().catch(() => {});
              document.removeEventListener('click', unlock);
              document.removeEventListener('touchstart', unlock);
            };
            document.addEventListener('click', unlock, { once: true });
            document.addEventListener('touchstart', unlock, { once: true });
          });
        }
      }
      tryAutoplay();

      function updatePlayIcon() {
        if (audio.paused) {
          playIcon.className = 'fas fa-play';
          player.classList.remove('playing');
        } else {
          playIcon.className = 'fas fa-pause';
          player.classList.add('playing');
        }
      }

      playBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (audio.paused) audio.play().catch(() => {});
        else audio.pause();
      });

      audio.addEventListener('play',  updatePlayIcon);
      audio.addEventListener('pause', updatePlayIcon);
      updatePlayIcon();

      audio.addEventListener('timeupdate', () => {
        if (!audio.duration) return;
        const pct = (audio.currentTime / audio.duration) * 100;
        fill.style.width = pct + '%';
      });

      progress.addEventListener('click', (e) => {
        e.stopPropagation();
        const rect = progress.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        if (audio.duration) audio.currentTime = pct * audio.duration;
      });

      /* Перетаскивание плеера */
      let isDragging = false;
      let startX, startY, startLeft, startTop;

      function getPos(el) {
        const r = el.getBoundingClientRect();
        return { left: r.left, top: r.top };
      }

      player.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.player-btn') || e.target.closest('.player-progress')) return;

        isDragging = true;
        player.classList.add('dragging');
        player.setPointerCapture(e.pointerId);

        const pos = getPos(player);
        player.style.right = 'auto';
        player.style.bottom = 'auto';
        player.style.left = pos.left + 'px';
        player.style.top  = pos.top  + 'px';

        startX = e.clientX;
        startY = e.clientY;
        startLeft = pos.left;
        startTop  = pos.top;
      });

      player.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        let newLeft = startLeft + dx;
        let newTop  = startTop  + dy;

        const w = player.offsetWidth;
        const h = player.offsetHeight;
        newLeft = Math.max(6, Math.min(window.innerWidth  - w - 6, newLeft));
        newTop  = Math.max(6, Math.min(window.innerHeight - h - 6, newTop));

        player.style.left = newLeft + 'px';
        player.style.top  = newTop  + 'px';
      });

      function endDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        player.classList.remove('dragging');
        try { player.releasePointerCapture(e.pointerId); } catch (_) {}
      }
      player.addEventListener('pointerup', endDrag);
      player.addEventListener('pointercancel', endDrag);

      window.addEventListener('resize', () => {
        if (player.style.left) {
          const r = player.getBoundingClientRect();
          const w = player.offsetWidth, h = player.offsetHeight;
          let l = r.left, t = r.top;
          l = Math.max(6, Math.min(window.innerWidth  - w - 6, l));
          t = Math.max(6, Math.min(window.innerHeight - h - 6, t));
          player.style.left = l + 'px';
          player.style.top  = t + 'px';
        }
      });
    })();
  </script>
</body>
</html>
